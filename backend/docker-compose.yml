services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # .env faylidan o'qiladi (POSTGRES_PASSWORD) — hech qachon shu faylga
      # hardcode qilinmasin. DB_URL (api service .env orqali o'qiydi) ham shu
      # parolga mos bo'lishi shart.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida ko'rsatilishi shart}
      POSTGRES_DB: edu_db
    ports:
      # Faqat localhost'ga ochiq — internetdan to'g'ridan-to'g'ri ulanib
      # bo'lmaydi (api container'i ichki Docker tarmog'i orqali ulanadi,
      # bunga bu port kerak emas — bu faqat serverdan turib qo'lda
      # tekshirish/SSH tunnel uchun qoldirilgan).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    ports:
      - "7001:7001"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
volumes:
  postgres_data:
  redis_data:
